<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff9f7">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="2026年10月5日，诚邀您与我们一起分享团团成长的喜悦。">

    <title>吴舒言（团团）成长宴邀请</title>
    <link rel="icon" href="./images/favicon.png">
    <link rel="canonical" href="https://www.wuzhaoyang.fun/extension/tuantuan-growth-q7m5p2/">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="吴舒言（团团）成长宴邀请">
    <meta property="og:description" content="2026年10月5日，诚邀您与我们一起分享团团成长的喜悦。">
    <meta property="og:url" content="https://www.wuzhaoyang.fun/extension/tuantuan-growth-q7m5p2/">
    <meta property="og:image" content="https://www.wuzhaoyang.fun/extension/tuantuan-growth-q7m5p2/images/share-cover.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="团团微笑着和小鸭玩偶合影">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="吴舒言（团团）成长宴邀请">
    <meta name="twitter:description" content="2026年10月5日，诚邀您与我们一起分享团团成长的喜悦。">
    <meta name="twitter:image" content="https://www.wuzhaoyang.fun/extension/tuantuan-growth-q7m5p2/images/share-cover.jpg">
    <meta name="twitter:image:alt" content="团团微笑着和小鸭玩偶合影">

    <link rel="preload" href="./images/hero-smile.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="./invite.css">
    <script src="./invite.js" defer></script>
  </head>
  <body>
    <main>
      <header class="hero" aria-labelledby="invitation-title">
        <picture class="hero__media">
          <source srcset="./images/hero-smile.webp" type="image/webp">
          <img
            src="./images/hero-smile.jpg"
            width="1440"
            height="1920"
            alt="团团戴着红色头巾，趴在小鸭玩偶旁开心地笑"
            fetchpriority="high"
          >
        </picture>

        <div class="hero__copy">
          <p class="hero__kicker">成长宴邀请</p>
          <h1 id="invitation-title">
            <span>吴舒言</span>
            <small>（团团）</small>
          </h1>
          <time datetime="2026-10-05">2026.10.05</time>
        </div>

        <div class="hero__scroll-mark" aria-hidden="true">
          <span></span>
        </div>
      </header>

      <section class="invitation reveal" aria-labelledby="invitation-message">
        <div class="content-column">
          <p class="section-label">一封家书</p>
          <h2 id="invitation-message">给最亲爱的家人和朋友</h2>
          <div class="invitation__copy">
            <p>因为你的到来，平凡的日子多了许多温柔与欢喜。</p>
            <p>小小的你，正一点点认识这个世界。</p>
            <p>我们想把这份成长的喜悦，分享给最亲近的人。</p>
            <p>诚邀您与家人赴宴，共同见证团团成长中的温暖时刻。</p>
          </div>
        </div>
      </section>

      <section class="memories" aria-label="团团的生活照片">
        <figure class="photo-block photo-block--rabbit reveal">
          <picture>
            <source srcset="./images/rabbit-chair.webp" type="image/webp">
            <img
              src="./images/rabbit-chair.jpg"
              width="1440"
              height="1920"
              alt="团团戴着白色小兔帽，坐在小椅子上看着镜头"
              loading="lazy"
              decoding="async"
            >
          </picture>
        </figure>

        <figure class="photo-block photo-block--family reveal">
          <picture>
            <source srcset="./images/family-moment.webp" type="image/webp">
            <img
              src="./images/family-moment.jpg"
              width="1440"
              height="1920"
              alt="家人陪着戴红色头巾的团团玩耍"
              loading="lazy"
              decoding="async"
            >
          </picture>
        </figure>
      </section>

      <section class="event reveal" aria-labelledby="event-title">
        <div class="content-column event__inner">
          <p class="section-label">相聚时刻</p>
          <h2 id="event-title">期待与您一起，分享这份喜悦</h2>

          <div class="event__date">
            <time datetime="2026-10-05">2026年10月5日</time>
            <p>星期一 · 农历丙午年 八月廿五</p>
          </div>

          <div class="event__times" aria-label="宴会时间">
            <div>
              <time datetime="2026-10-05T18:00:00+08:00">18:00</time>
              <span>恭候</span>
            </div>
            <div>
              <time datetime="2026-10-05T19:00:00+08:00">19:00</time>
              <span>开席</span>
            </div>
          </div>

          <div class="event__place">
            <p class="event__place-name">韩村镇国宴厅</p>
            <address>淮北市濉溪县韩村镇国宴厅</address>
          </div>
        </div>
      </section>

      <section class="closing reveal" aria-labelledby="closing-title">
        <picture class="closing__photo">
          <source srcset="./images/sleeping-close.webp" type="image/webp">
          <img
            src="./images/sleeping-close.jpg"
            width="810"
            height="1440"
            alt="团团盖着花朵小被子安静地熟睡"
            loading="lazy"
            decoding="async"
          >
        </picture>

        <div class="closing__copy">
          <p id="closing-title">愿所有美好，如约而至</p>
          <span aria-hidden="true"></span>
          <p class="closing__signature">王娟娟全家敬邀</p>
        </div>
      </section>
    </main>
  </body>
</html>
